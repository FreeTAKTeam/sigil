[processing]
parallel_voice_bss = true
correlation_timeout_ms = 5000
# A VR-N76 may send its BSS packet as a separate burst 1-2.5 s after the
# voice. Packets starting within this gap still identify the speaker.
trailing_id_gap_ms = 3000

[identity]
auto_register = true
registry_path = "data/identities"
allowlist = ["R4", "R5"]
# Publish speech that carried no BSS ID from a separate gateway identity.
# It never uses a radio's identity. It has no GPS position: contact reports
# from it are ignored, and its MECP events are sent without a location.
unidentified_sender = false
unidentified_name = "Unidentified radio"

[fabric]
tcp_clients = []
local_storage_path = "data/fabric"

[rch]
enabled = false
destination_hash = ""
send_chat = true
# Start each chat message with the radio name, frequency and time.
chat_header = false
send_telemetry = true
# Publish Kodiak voice commands: MECP reports, contact markers and RCH commands.
send_intents = true

[kodiak]
# Activation word spellings as the speech recognizer writes them.
wake_words = ["kodiak", "kodiac", "codiak", "codiac", "codeiac"]
# Clock-direction contact reports need a verified compass heading. Enable only
# if your radios report a compass heading in BSS, not GPS course over ground.
bss_heading_is_compass = false
# A contact marker uses the fix from the reporting transmission; without one,
# it may use the radio's last fix only if it is at most this many seconds old.
marker_max_fix_age_s = 300
# Command recognition: "deterministic" (vocabulary rules) or "laya" (a laya
# typed-decision model checked against the rules; needs a `--features laya`
# build and a checkpoint of about 0.8 GB). Both classifiers accept a misheard
# first word such as "Kardiac" (a deterministic check, not the model).
classifier = "deterministic"
# laya checkpoint directory (relative to this file) and the calibrated
# probability every answer must reach.
laya_checkpoint = "models/laya/english"
laya_threshold = 0.85

[receiver]
# Optional position of the SDR antenna, in decimal degrees (south and west
# negative). When set, the log shows how far each BSS packet with a GPS fix
# was from the antenna. Events are unchanged.
# antenna = { latitude = 51.477800, longitude = -0.001500 }
