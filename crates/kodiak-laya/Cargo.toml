[package]
name = "kodiak-laya"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
# laya-candle is Apache-2.0; combined with this GPL-2.0-or-later crate the
# result is distributed under GPLv3 terms. See NOTICE.
license = "GPL-2.0-or-later"
description = "R3AKT Kodiak: a laya typed-decision classifier behind the IntentClassifier trait"
repository = "https://github.com/FreeTAKTeam/R3AKT-Kodiak"

[dependencies]
kodiak-core = { path = "../kodiak-core", version = "0.1.0" }
kodiak-intent = { path = "../kodiak-intent", version = "0.1.0" }
laya-candle = { version = "0.1.2", default-features = false }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
