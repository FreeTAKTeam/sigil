[[severities]]
level = 0
label = "Mayday"
# Parakeet transcribed a spoken "mayday" over live NFM as "May Day" and, from
# the saved WAV of the same transmission, as "may they".
# On 22 November 2026 Corvo's "mayday" was heard as "made a" twice, and an
# Italian speaker's (voice notes) as "Medei" and "may die".
words = ["mayday", "may day", "may they", "made a", "medei", "may die"]

[[severities]]
level = 1
label = "Urgent"
# Corvo's "urgent" was heard as "urging" over live NFM (22 November 2026).
words = ["urgent", "urgently", "urging"]

[[severities]]
level = 2
label = "Safety"
words = ["safety"]

[[severities]]
level = 3
label = "Routine"
# An operator said "normal" for routine over live NFM (21 November 2026).
words = ["routine", "normal"]

