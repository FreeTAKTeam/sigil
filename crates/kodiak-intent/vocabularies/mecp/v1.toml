# Kodiak MECP voice vocabulary, version 1, revision 9.
#
# Codes, labels and severities follow the canonical MECP tables:
#   REM  apps/mobile/src/utils/mecp.ts               (commit 3e1e172)
#   RCH  crates/r3akt-profile-rch/src/lib.rs          (commit c2bf78a)
# Kodiak only adds spoken phrases. It does not redefine the protocol.
# B04 (Household / community status) exists in REM only; RCH reports it as an
# unknown code, so it is not offered by voice.
#
# Phrases are lower-case word sequences. Punctuation and apostrophes split
# words ("can't" is "can t"). When phrases overlap, the longest match wins.
# Several events may be reported at once ("injured, broken leg, need water"
# is M01 M07 S01, in the order spoken). A report is rejected when two event
# phrases cross each other ("need water rescue": S01 or T11?), when it
# names events listed together under [[conflicts]], or when a negation is
# left over after the event phrases are matched.
#
# Revision 2 (22 November 2026): multiple event codes, structured parameters
# ([parameters], [languages]), negations and conflicts.

schema = "kodiak.vocabulary.mecp"
version = 1
revision = 9

# Words that may surround an MECP report without changing its meaning.
fillers = ["we", "i", "a", "an", "the", "is", "are", "am", "please", "more", "some",
  "now", "here", "there", "at", "our", "my", "location", "report", "mecp", "event",
  "has", "have", "got", "been", "it", "and", "very", "badly", "need", "needed", "requires",
  "someone", "for", "in", "needs", "also", "plus", "with"]

# Words that negate or cancel the report when no event phrase uses them.
# "not breathing", "no water" and "cancel beacon" are events, so they stay
# valid; "mayday don't need water" is rejected as cancelled.
negations = ["not", "no", "never", "don", "dont", "doesn", "didn", "isn", "aren",
  "wasn", "won", "cannot", "cancel", "cancelled", "canceled", "without", "nothing",
  "none", "stop", "ignore", "negative", "belay", "scratch"]

# Structured values (MECP extras). Every value must be spoken; Kodiak never
# fills one in from metadata. Keyword values take at most `max_value_words`
# words and stop at the first filler, keyword, negation or event word.
[parameters]
# "<number> <unit>": a person count, encoded as <n>pax. H07 also accepts a
# bare number ("space for five").
pax_units = ["people", "persons", "person", "pax"]
# ETA or duration after R03, as units in minutes. A bare number is minutes.
eta_units = { minute = 1, minutes = 1, min = 1, mins = 1, hour = 60, hours = 60, hr = 60, hrs = 60 }
# "callsign bravo six" -> ~BRAVO-6. "cosign" and "cold sign" are how
# Parakeet wrote "callsign" on live NFM audio (22 November 2026); "con sign"
# from an Italian speaker the same day.
callsign_words = ["callsign", "call sign", "cosign", "cold sign", "con sign"]
# "reference alpha one" -> #ALPHA-1
reference_words = ["reference", "ref", "incident number", "ticket"]
# "time fourteen thirty", "time 1430 hours", "1430 zulu" -> @1430
timestamp_words = ["time", "timestamp", "time of event"]
# Words that may follow a time. Only these mark a time without a keyword.
timestamp_suffixes = ["zulu", "local"]
# Optional after a keyworded time.
timestamp_trailing = ["hours", "hrs", "zulu", "local"]
# "language french" -> @fr
language_words = ["language", "speaks", "speaking"]
# "details north gate behind the barn": every word after it, as transcribed.
text_words = ["details", "note", "notes", "remarks", "description"]
# Coordinates are a pair of decimal numbers ("45.5017, -73.5673", "forty five
# point five minus seventy three point five"); "minus" makes the next negative.
minus_words = ["minus"]
coordinate_separators = ["comma", "by"]
max_value_words = 3
# Words a callsign or reference may contain besides numbers: the phonetic
# alphabet. Any other word rejects the report, so a misheard letter ("Revo"
# for "Bravo") is never sent as part of a callsign. Empty allows any word.
identifier_words = ["alpha", "alfa", "bravo", "charlie", "delta", "echo", "foxtrot",
  "golf", "hotel", "india", "juliet", "juliett", "kilo", "lima", "mike", "november",
  "oscar", "papa", "quebec", "romeo", "sierra", "tango", "uniform", "victor",
  "whiskey", "whisky", "xray", "yankee", "zulu"]

