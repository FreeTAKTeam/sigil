# Kodiak MECP voice vocabulary, version 1.
#
# Codes, labels and severities follow the canonical MECP tables:
#   REM  apps/mobile/src/utils/mecp.ts               (commit 3e1e172)
#   RCH  crates/r3akt-profile-rch/src/lib.rs          (commit c2bf78a)
# Kodiak only adds spoken phrases. It does not redefine the protocol.
# B04 (Household / community status) exists in REM only; RCH reports it as an
# unknown code, so it is not offered by voice.
#
# Phrases are lower-case word sequences. Punctuation and apostrophes split
# words ("can't" is "can t"). When phrases overlap, the longest match wins;
# two different codes in one command are rejected as ambiguous.

schema = "kodiak.vocabulary.mecp"
version = 1

# Words that may surround an MECP report without changing its meaning.
fillers = ["we", "i", "a", "an", "the", "is", "are", "am", "please", "more", "some",
  "now", "here", "there", "at", "our", "my", "location", "report", "mecp", "event",
  "has", "have", "got", "been", "it", "and", "very", "badly", "need", "needed", "requires",
  "someone", "for", "in", "needs"]

[[severities]]
level = 0
label = "Mayday"
# Parakeet transcribed a spoken "mayday" over live NFM as "May Day" and, from
# the saved WAV of the same transmission, as "may they".
words = ["mayday", "may day", "may they"]

[[severities]]
level = 1
label = "Urgent"
words = ["urgent", "urgently"]

[[severities]]
level = 2
label = "Safety"
words = ["safety"]

[[severities]]
level = 3
label = "Routine"
# An operator said "normal" for routine over live NFM (21 November 2026).
words = ["routine", "normal"]

