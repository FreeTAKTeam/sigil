[package]
name = "kodiak-intent"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "GPL-2.0-or-later"
description = "R3AKT Kodiak: versioned MECP, contact and RCH vocabularies and intent classifiers"
repository = "https://github.com/FreeTAKTeam/R3AKT-Kodiak"

[dependencies]
kodiak-core = { path = "../kodiak-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
